<!doctype html>
<html lang="fa" dir="rtl">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Tauri + SvelteKit + Typescript App</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
        />
        %sveltekit.head%
        <script>
            // Immediately apply the preferred locale from localStorage to prevent flickering during hydration
            (function () {
                if (typeof window !== "undefined") {
                    const savedLocale = localStorage.getItem("locale") || "fa";
                    document.documentElement.lang = savedLocale;
                    document.documentElement.dir =
                        savedLocale === "fa" ? "rtl" : "ltr";
                }
            })();
        </script>
    </head>
    <body data-sveltekit-preload-data="hover">
        <div id="svelte" style="display: contents">%sveltekit.body%</div>
    </body>
</html>
